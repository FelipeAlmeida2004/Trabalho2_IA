[project]
name = "trabalho2-ia"
version = "0.1.0"
description = "Agente de classificação de leucócitos por regras (Trabalho 2 de IA - UFSCar)"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.5.5,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
